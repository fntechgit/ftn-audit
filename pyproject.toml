[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftn-audit"
version = "0.1.0"
description = "Foxtrot November shared audit-logging library for Django/DRF micro-services"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
    "celery>=5.3",
    "django-dirtyfields>=1.9",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-django>=4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
